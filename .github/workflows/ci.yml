name: AgriGuard RT-SCADA CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Real-Time Schedulability & CI Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java: [ '21' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Compile Sources (Pure Standard Library)
        run: |
          mkdir -p bin
          javac -encoding UTF-8 -d bin src/*.java

      - name: Execute Deterministic Headless Verification Suite
        run: |
          java -Djava.awt.headless=true -cp bin Main --headless-test

      - name: Generate Telemetry Sample & Test SHA-256 Audit Chain (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p logs
          java -Djava.awt.headless=true -cp bin Main --headless --no-http --no-modbus &
          PID=$!
          sleep 4
          kill -SIGTERM $PID || true
          wait $PID 2>/dev/null || true
          java -cp bin Main --verify-audit

      - name: Generate Telemetry Sample & Test SHA-256 Audit Chain (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $p = Start-Process java -ArgumentList "-Djava.awt.headless=true","-cp","bin","Main","--headless","--no-http","--no-modbus" -PassThru
          Start-Sleep -Seconds 4
          Stop-Process -Id $p.Id -Force
          java -cp bin Main --verify-audit

  container-build:
    name: Docker Container Build & Image Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agriguard-rt-scada:latest
